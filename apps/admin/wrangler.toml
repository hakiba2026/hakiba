name = "haqiba-admin"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".next"

[[d1_databases]]
binding = "DB"
database_name = "haqiba-db"
database_id = "PLACEHOLDER_D1_ID"

[[kv_namespaces]]
binding = "KV"
id = "PLACEHOLDER_KV_ID"

[[r2_buckets]]
binding = "FILES"
bucket_name = "haqiba-files"
